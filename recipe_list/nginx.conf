server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Flutter web assets — long cache for hashed files.
    #
    # The named-capture `?<asset>` matches the basename of the
    # requested file (everything after the last `/`). Deep-link
    # URLs like `/en/recipes/52772` cause `fetch('sqlite3.wasm')`
    # and `<link rel=manifest>` icon URLs to be resolved against
    # the page path rather than `<base href="/">`, producing
    # requests like `/en/recipes/sqlite3.wasm` that don't exist
    # on disk. Without the fallback, those requests 404 and
    # sqflite_common_ffi_web's IndexedDB init throws, so Flutter
    # never finishes booting — the boot splash spins forever and
    # the recipe never renders. We `try_files` the literal URI
    # first (preserves long-cache for hashed assets), then the
    # basename at site root (recovers the wasm/png/etc that the
    # SPA actually needs), and only 404 if neither exists.
    location ~* ^/(?:.+/)?(?<asset>[^/]+\.(?:js|wasm|css|png|jpg|jpeg|gif|ico|svg|woff2?))$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri /$asset /icons/$asset =404;
    }

    # Flutter SPA routes under `/recipes` must resolve to index.html on
    # hard-reload. Keep these explicit route handlers before the API
    # proxy block below.
    location = /recipes {
        try_files /index.html =404;
    }

    location = /recipes/ {
        try_files /index.html =404;
    }

    location ~ ^/recipes/(details/[^/]+|add|edit/[^/]+)/?$ {
        try_files /index.html =404;
    }

    # Passkey / recipes API — proxy to backend user-portal so that
    # POST requests (and future PUT/DELETE) are not swallowed by
    # try_files, which returns 405 on POST to a static-file fallback.
    location /recipes/ {
        proxy_pass http://mahallem-user-portal:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # All routes fall back to index.html (Flutter client-side router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
