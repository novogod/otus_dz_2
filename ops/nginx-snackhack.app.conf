# Host nginx vhost for snackhack.app (and www.snackhack.app redirect).
#
# Install on prod with:
#   install -o root -g root -m 0644 \
#     /var/www/recipie/otus_dz_2/ops/nginx-snackhack.app.conf \
#     /etc/nginx/sites-available/snackhack.app
#   ln -sf /etc/nginx/sites-available/snackhack.app \
#           /etc/nginx/sites-enabled/snackhack.app
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d snackhack.app -d www.snackhack.app
#
# Note: .app is HSTS-preloaded — browsers always send HTTPS.
# Certbot is required before the domain will load in any browser.
#
# The vhost proxies to the same Flutter-web container (127.0.0.1:8088)
# and pre-render service (127.0.0.1:8089) as recipies.mahallem.ist.

map $http_user_agent $is_bot_snackhack {
    default                         0;
    ~*googlebot                     1;
    ~*bingbot                       1;
    ~*yandex                        1;
    ~*duckduckbot                   1;
    ~*baiduspider                   1;
    ~*facebookexternalhit           1;
    ~*facebookcatalog               1;
    ~*facebot                       1;
    ~*twitterbot                    1;
    ~*linkedinbot                   1;
    ~*whatsapp                      1;
    ~*telegrambot                   1;
    ~*slackbot                      1;
    ~*discordbot                    1;
    ~*pinterestbot                  1;
    ~*redditbot                     1;
    ~*applebot                      1;
}

map $is_bot_snackhack $recipe_upstream_snackhack {
    default                         http://127.0.0.1:8088;
    1                               http://127.0.0.1:8089;
}

# Redirect www → apex
server {
    listen 80;
    listen 443 ssl http2;
    server_name www.snackhack.app;

    # Placeholder certs — replaced by certbot
    ssl_certificate /etc/letsencrypt/live/snackhack.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snackhack.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://snackhack.app$request_uri;
}

server {
    server_name snackhack.app;

    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/xml+rss text/javascript image/svg+xml;

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|css|js)$ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/(en|ru|de|es|fr|it|tr|ar|fa|ku)/recipes/[0-9]+/?$ {
        proxy_pass $recipe_upstream_snackhack;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/snackhack.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snackhack.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = snackhack.app) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name snackhack.app;
    return 404;
}
